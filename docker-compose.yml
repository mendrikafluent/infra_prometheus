version: "3.8"

networks:
  devops-network:
    external: true

volumes:
  prometheus_data: {}
  grafana-storage:

services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt:ro
    restart: unless-stopped
    networks:
      - devops-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_interface
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=12h"
      - "--web.external-url=http://92.222.86.157.nip.io/prometheus"
      - "--web.route-prefix=/"
      - "--web.enable-admin-api"
    ports:
      - "127.0.0.1:9090:9090" ## bound to localhost only — see README for remote access
    networks:
      - devops-network

  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    ports:
      - "127.0.0.1:9100:9100" # bound to localhost only, scraped internally by prometheus
    networks:
      - devops-network

  grafana:
    image: grafana/grafana:latest
    depends_on:
      - nginx
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin # À changer !
      - GF_SERVER_ROOT_URL=https://92.222.86.157.nip.io/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
    networks:
      - devops-network
