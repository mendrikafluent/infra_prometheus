global:
  scrape_interval: 15s       # how often to scrape targets by default
  evaluation_interval: 15s   # how often to evaluate alerting rules

rule_files:
  - "rules/*.yml"

scrape_configs:
  # Prometheus scraping itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # node_exporter — system metrics of the VPS (CPU, RAM, disk, network)
  - job_name: "node"
    static_configs:
      - targets: ["node_exporter:9100"]
  
  - job_name: "api"
    static_configs:
      - targets: ["prometheus:3000"] 
