name: Deploy Infrastructure

on:
  push:
    branches: [main]

jobs:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # CI: Validation (exécuté sur GitHub)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  validate:
    runs-on: ubuntu-latest # ← Machine de GitHub
    steps:
      - uses: actions/checkout@v3

      - name: Validate Prometheus config
        run: |
          # ✅ Exécuté sur le runner GitHub
          docker run --rm -v $PWD:/config --entrypoint promtool prom/prometheus:latest \
            check config /config/prometheus.yml

      - name: Validate Nginx config
        run: |
          # ✅ Exécuté sur le runner GitHub
          # Le runner n'a ni le réseau docker-compose (noms de service non résolus)
          # ni les certs Let's Encrypt du VPS : on les simule pour que `nginx -t`
          # puisse charger la conf sans lancer le vrai stack.
          mkdir -p /tmp/fake-certs
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -subj "/CN=localhost" \
            -keyout /tmp/fake-certs/privkey.pem \
            -out /tmp/fake-certs/fullchain.pem

          docker run --rm \
            --add-host prometheus:127.0.0.1 \
            --add-host prometheus_interface:127.0.0.1 \
            -v $PWD/nginx.conf:/etc/nginx/nginx.conf:ro \
            -v /tmp/fake-certs:/etc/letsencrypt/live/92.222.86.157.nip.io:ro \
            nginx:alpine nginx -t

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # CD: Déploiement (exécuté sur TON VPS)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  deploy:
    runs-on: ubuntu-latest # ← Mais utilise SSH
    needs: validate # ← Attendre que validate passe
    steps:
      - uses: actions/checkout@v3

      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/docker-infra
            git pull origin main
            docker compose up -d --build
