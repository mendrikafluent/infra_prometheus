name: Deploy Infrastructure

on:
  push:
    branches: [main]

jobs:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # CI: Validation (exécuté sur GitHub)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  validate:
    runs-on: ubuntu-latest # ← Machine de GitHub
    steps:
      - uses: actions/checkout@v3

      - name: Validate Prometheus config
        run: |
          # ✅ Exécuté sur le runner GitHub
          docker run --rm -v $PWD:/config --entrypoint promtool prom/prometheus:latest \
            check config /config/prometheus.yml

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # CD: Déploiement (exécuté sur TON VPS)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  deploy:
    runs-on: ubuntu-latest # ← Mais utilise SSH
    needs: validate # ← Attendre que validate passe
    steps:
      - uses: actions/checkout@v3

      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/docker-infra
            git pull origin main

            docker compose up -d --build
