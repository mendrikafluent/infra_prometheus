user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Reverse proxy nginx -> api + prometheus
    # Les deux services sont dans le même réseau docker (devops-network),
    # donc on les joint directement par leur nom de service (DNS interne docker).

    upstream api_upstream {
        server prometheus:3000;
    }

    upstream prometheus_upstream {
        server prometheus_interface:9090;
    }

    server {
        listen 443 ssl;
        server_name 92.222.86.157.nip.io;

        ssl_certificate /etc/letsencrypt/live/92.222.86.157.nip.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/92.222.86.157.nip.io/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
	}
        # --- API ---
        location / {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # --- Prometheus, accessible sur /prometheus/ ---
        location /prometheus/ {
            proxy_pass http://prometheus_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
